<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clemson New Tab</title>
<link rel="icon" type="image/png" href="resources/paw-orange.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div id="weather-overlay"></div>
    <img id="layer4" class="layer" src="resources/Footer_Layer4.png" alt="">
    <img id="clemson-logo" class="corner-mark" src="resources/ClemsonUniversity_RGB__Orange.png" alt="Clemson University">
    <img id="layer3" class="layer" src="resources/Footer_Layer3.png" alt="">
    <img id="layer2" class="layer" src="resources/Footer_Layer2.png" alt="">
    <img id="paw" class="corner-mark" src="resources/Paw_RGB__Orange.png" alt="Clemson Paw">
    <div id="bookmarks-section"></div>
    <img id="layer1" class="layer" src="resources/Footer_Layer1.png" alt="">
  </div>

  <form id="search-form" action="https://duckduckgo.com/" autocomplete="off">
    <input id="search-input" type="text" name="q" placeholder="Search DuckDuckGo" autofocus>
  </form>

  <div id="weather-widget"></div>


  <button id="settings-toggle" type="button" aria-label="Settings"
          aria-expanded="false" aria-controls="settings-panel">
    <!-- Inline SVG rather than an image file so the gear needs no new
         asset and picks up currentColor. -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M19.9 15.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 0 1-2.91 2.91l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55v.17a2.06 2.06 0 0 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.91-2.91l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H2.99a2.06 2.06 0 0 1 0-4.12h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.91-2.91l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.55V2.9a2.06 2.06 0 0 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 0 1 2.91 2.91l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1.03h.17a2.06 2.06 0 0 1 0 4.12h-.09a1.7 1.7 0 0 0-1.55 1.03z"></path>
    </svg>
  </button>

  <!-- Contents are generated from SETTINGS_GROUPS in the script below. -->
  <div id="settings-panel"></div>

  <div id="bookmark-editor" hidden>
    <div id="bookmark-editor-card" role="dialog" aria-modal="true" aria-labelledby="bookmark-editor-title">
      <div id="bookmark-editor-title">Bookmarks</div>
      <div id="bookmark-editor-body"></div>
      <button type="button" class="bm-btn" id="bookmark-editor-add-category">+ Add category</button>
      <div id="bookmark-editor-actions">
        <span id="bookmark-editor-status" role="status"></span>
        <button type="button" class="bm-btn" id="bookmark-editor-cancel">Cancel</button>
        <button type="button" class="bm-btn primary" id="bookmark-editor-save">Save</button>
      </div>
    </div>
  </div>


  <div id="precip-layer"></div>

  <script src="app.js"></script>
</body>
</html>
